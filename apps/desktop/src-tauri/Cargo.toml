[package]
name = "shotbeam-desktop"
version = "0.1.0"
description = "Shotbeam desktop app"
edition = "2021"
rust-version = "1.85"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "shotbeam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
toml_edit = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
